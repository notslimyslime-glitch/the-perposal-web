<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5b182b" />
  <title>A Little Question 💌</title>
  <style>
    :root { --wine:#5b182b; --deep-wine:#3d1020; --cream:#fff8f1; --pink:#e99aaa; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      overflow:hidden; color:var(--deep-wine); font-family:"Trebuchet MS","Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 15% 20%,rgba(255,255,255,.10) 0 2px,transparent 3px),
        radial-gradient(circle at 80% 75%,rgba(255,255,255,.10) 0 2px,transparent 3px),
        linear-gradient(145deg,#6e2036,var(--wine) 55%,#35101e);
      background-size:46px 46px,58px 58px,auto;
    }
    .card {
      width:min(100%,440px); padding:42px 28px 34px; text-align:center;
      background:var(--cream); border:3px solid rgba(255,225,225,.85); border-radius:28px;
      box-shadow:0 24px 70px rgba(25,0,10,.35),inset 0 0 0 7px rgba(233,154,170,.13);
      position:relative; animation:pop-in .7s cubic-bezier(.2,.8,.2,1) both;
    }
    .card::before,.card::after { content:"✦"; position:absolute; color:var(--pink); font-size:24px; }
    .card::before { top:17px; left:20px; } .card::after { right:20px; bottom:15px; }
    .sticker {
      width:142px; height:142px; display:grid; place-items:center; margin:0 auto 20px;
      border-radius:42% 58% 48% 52% / 52% 42% 58% 48%; background:#f9dce0;
      box-shadow:0 8px 0 #edb9c2; font-size:82px; transform:rotate(-4deg); user-select:none;
    }
    .eyebrow { margin:0 0 10px; color:#a65a6b; font-size:12px; font-weight:800; letter-spacing:.22em; text-transform:uppercase; }
    h1 { margin:0; color:var(--wine); font-family:Georgia,serif; font-size:clamp(27px,7vw,36px); line-height:1.18; }
    .subtitle { margin:13px auto 27px; max-width:290px; color:#81515b; font-size:15px; line-height:1.6; }
    .buttons { display:flex; justify-content:center; gap:13px; flex-wrap:wrap; }
    button {
      min-width:116px; border:0; border-radius:999px; padding:13px 24px;
      font:inherit; font-size:15px; font-weight:800; cursor:pointer;
      transition:transform .18s ease,box-shadow .18s ease,background .18s ease;
    }
    button:hover { transform:translateY(-3px); }
    button:focus-visible { outline:3px solid #d17a8d; outline-offset:4px; }
    #yes { color:white; background:var(--wine); box-shadow:0 5px 0 var(--deep-wine); }
    #yes:hover { background:#76243c; }
    #no {
      color:#64152e; background:#ffd5df; border:2px solid #f3a8ba;
      box-shadow:0 0 0 3px rgba(255,213,223,.35),0 5px 0 #dc91a4,0 0 18px rgba(255,175,197,.8);
      animation:soft-glow 1.5s ease-in-out infinite alternate;
    }
    #no.running {
      position:fixed; z-index:5; margin:0;
      transition:left .55s cubic-bezier(.2,.8,.2,1),top .55s cubic-bezier(.2,.8,.2,1),transform .2s ease;
      box-shadow:0 0 0 4px rgba(255,213,223,.55),0 0 24px 8px rgba(255,170,195,.95);
    }
    #message { min-height:25px; margin:23px 0 0; color:#8e4055; font-family:Georgia,serif; font-size:17px; font-weight:bold; }
    .tiny-note { margin:12px 0 0; color:#b18a8f; font-size:11px; letter-spacing:.08em; }
    @keyframes pop-in { from { opacity:0; transform:translateY(18px) scale(.96); } to { opacity:1; transform:translateY(0) scale(1); } }
    @keyframes soft-glow { from { box-shadow:0 0 0 2px rgba(255,213,223,.3),0 5px 0 #dc91a4,0 0 10px rgba(255,175,197,.55); } to { box-shadow:0 0 0 5px rgba(255,213,223,.55),0 5px 0 #dc91a4,0 0 24px rgba(255,175,197,1); } }
    @media (max-width:380px) { .card { padding:36px 20px 29px; } .sticker { width:122px; height:122px; font-size:70px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="sticker" id="sticker" aria-label="Cute teddy bear sticker" role="img">🧸</div>
    <p class="eyebrow">a tiny question</p>
    <h1 id="heading">Will you say yes?</h1>
    <p class="subtitle" id="subtitle">A little note, a little courage, and one very important question. 💌</p>
    <div class="buttons">
      <button id="yes" type="button">Yes! 💗</button>
      <button id="no" type="button">No</button>
    </div>
    <p id="message" role="status" aria-live="polite"></p>
    <p class="tiny-note">MADE WITH A LITTLE BIT OF HEART ✦</p>
  </main>
  <script>
    const heading = document.getElementById("heading");
    const subtitle = document.getElementById("subtitle");
    const sticker = document.getElementById("sticker");
    const message = document.getElementById("message");
    const noButton = document.getElementById("no");
    let noClicks = 0;
    let running = false;

    document.getElementById("yes").addEventListener("click", () => {
      heading.textContent = "YAY! 💖";
      subtitle.textContent = "You just made this moment extra sweet.";
      sticker.textContent = "🥰";
      message.textContent = "Thanks for making me smile!";
      noButton.style.display = "none";
    });

    function sayNo() {
      heading.textContent = "No worries 💗";
      subtitle.textContent = "Thanks for being honest. Your answer is respected.";
      sticker.textContent = "🌷";
      message.textContent = "No is a completely okay answer.";
      noButton.style.display = "none";
    }

    noButton.addEventListener("click", () => {
      noClicks += 1;
      const screens = [
        ["Are you sure? 🥺", "Just checking! Take your time.", "🐻"],
        ["Think again? 💌", "Pretty please? Only if you want to.", "🥹"],
        ["One more tiny thought? 🌸", "No pressure. Your choice matters.", "🐰"]
      ];
      if (noClicks <= 3) {
        const screen = screens[noClicks - 1];
        heading.textContent = screen[0];
        subtitle.textContent = screen[1];
        sticker.textContent = screen[2];
        message.textContent = "You can still choose No whenever you like.";
      } else if (noClicks >= 4) {
        heading.textContent = "Haha, catch me if you can! 😄";
        subtitle.textContent = "The No button only moves when you click it!";
        sticker.textContent = "🙈";
        message.textContent = "Boop! It moved. Try catching it again!";
        if (!running) {
          running = true;
          noButton.classList.add("running");
        }
        const maxX = Math.max(8, window.innerWidth - noButton.offsetWidth - 8);
        const maxY = Math.max(8, window.innerHeight - noButton.offsetHeight - 8);
        noButton.style.left = `${Math.floor(Math.random() * maxX)}px`;
        noButton.style.top = `${Math.floor(Math.random() * maxY)}px`;
      } else {
        sayNo();
      }
    });
  </script>
</body>
</html>
