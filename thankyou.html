<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5b182b" />
  <script>
    // Allow the one-time URL created by the Yes button, then clean it.
    // Refreshing the clean thank-you URL returns to the question page.
    const entry = new URLSearchParams(window.location.search).get("from");
    if (entry === "yes") {
      window.history.replaceState(null, "", window.location.pathname);
    } else {
      window.location.replace("index.html");
    }
  </script>
  <title>Thank You! 💗</title>
  <style>
    :root { --wine:#5b182b; --cream:#fff8f1; --pink:#f3a8ba; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; padding:28px 16px; display:grid; place-items:center;
      overflow:hidden; color:var(--wine); font-family:"Trebuchet MS","Segoe UI",sans-serif;
      background:radial-gradient(circle at 15% 20%,rgba(255,255,255,.1) 0 2px,transparent 3px),
        linear-gradient(145deg,#6e2036,#5b182b 55%,#35101e); background-size:46px 46px,auto;
    }
    .card {
      position:relative; z-index:2; width:min(100%,520px); padding:34px 28px;
      text-align:center; background:var(--cream); border:3px solid #ffe1e1;
      border-radius:28px; box-shadow:0 24px 70px rgba(25,0,10,.35),inset 0 0 0 7px rgba(233,154,170,.13);
      animation:pop .7s ease both;
    }
    .eyebrow { color:#a65a6b; font-size:12px; font-weight:800; letter-spacing:.22em; text-transform:uppercase; }
    h1 { margin:8px 0 12px; font: bold clamp(32px,8vw,46px)/1.12 Georgia,serif; }
    .poem { margin:14px auto 20px; color:#81515b; font:18px/1.75 Georgia,serif; }
    .gif { display:block; width:min(100%,230px); max-height:220px; object-fit:contain; margin:0 auto 8px; border-radius:18px; }
    .surprise {
      margin-top:14px; padding:13px 24px; border:0; border-radius:999px;
      color:white; background:var(--wine); font:800 15px "Trebuchet MS","Segoe UI",sans-serif;
      cursor:pointer; box-shadow:0 4px 0 #35101e; transition:transform .18s ease, box-shadow .18s ease;
    }
    .surprise:hover { transform:translateY(-2px); box-shadow:0 6px 0 #35101e; }
    .surprise:active { transform:translateY(2px); box-shadow:0 2px 0 #35101e; }
    .surprise-note { margin:16px 0 0; color:#a34c68; font-weight:800; animation:pop .35s ease both; }
    .balloon {
      position:fixed; z-index:1; bottom:-130px; width:34px; height:44px; border-radius:50% 50% 46% 46%;
      opacity:0; animation:float-up 5.5s ease-in forwards; pointer-events:none;
    }
    .balloon::after { content:""; position:absolute; left:50%; top:42px; width:1px; height:38px; background:rgba(255,255,255,.65); }
    .b1 { left:8%; background:#f3a8ba; animation-delay:.1s; }
    .b2 { left:23%; background:#f6d28c; animation-delay:.45s; }
    .b3 { left:43%; background:#d9a6d8; animation-delay:.2s; }
    .b4 { left:66%; background:#f3a8ba; animation-delay:.7s; }
    .b5 { left:86%; background:#f6d28c; animation-delay:.35s; }
    @keyframes float-up { 0% { transform:translateY(0) rotate(-8deg); opacity:0; } 12% { opacity:.95; } 100% { transform:translateY(-120vh) rotate(14deg); opacity:0; } }
    @keyframes pop { from { opacity:0; transform:translateY(16px) scale(.97); } to { opacity:1; transform:none; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; } }
  </style>
</head>
<body>
  <div class="balloon b1"></div><div class="balloon b2"></div><div class="balloon b3"></div><div class="balloon b4"></div><div class="balloon b5"></div>
  <main class="card">
    <p class="eyebrow">a little moment to remember</p>
    <h1>Thank You! 💗</h1>
    <p class="poem">
      A little yes, a brighter day,<br>
      A thousand smiles along the way.<br>
      May happy moments find you there,<br>
      Like little stars tucked everywhere. ✨
    </p>
    <img class="gif" src="200.gif" alt="Cute happy crying face making a heart with its hands">
    <p class="poem">Sending you a pocketful of joy! 🌷</p>
    <button class="surprise" id="surpriseButton" type="button">A little surprise ✨</button>
    <p class="surprise-note" id="surpriseNote" hidden>You deserve all the happy little things! 💖</p>
  </main>
  <script>
    // Balloons animate once on page load, with no repeating loop.
    document.querySelectorAll(".balloon").forEach(balloon => {
      balloon.addEventListener("animationend", () => balloon.remove(), { once:true });
    });

    document.getElementById("surpriseButton").addEventListener("click", () => {
      const note = document.getElementById("surpriseNote");
      note.hidden = false;
      document.getElementById("surpriseButton").textContent = "Surprise opened! 💗";
    }, { once:true });
  </script>
</body>
</html>
